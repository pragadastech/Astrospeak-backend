server:
  port: 8080
spring:
  datasource:
    url: ${ASTRO_JDBC_URL:jdbc:postgresql://localhost:5435/astrotalk}
    username: ${ASTRO_DB_USER:astrotalk}
    password: ${ASTRO_DB_PASSWORD:astrotalk}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  mail:
    host: ${SMTP_HOST:smtp.office365.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:sales@avus24.com}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
astro:
  admin-email: ${ADMIN_EMAIL:admin@astrologytalk.local}
  admin-password: ${ADMIN_PASSWORD:Admin@123}
  business-state: ${BUSINESS_STATE:Telangana}
  jwt-secret: ${JWT_SECRET:astrology-talk-dev-secret-change-in-production-32}
  mail-from: ${SMTP_FROM:sales@avus24.com}
  whatsapp-token: ${WHATSAPP_TOKEN:}
  whatsapp-phone-id: ${WHATSAPP_PHONE_ID:}
